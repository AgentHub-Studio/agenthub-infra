---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-low-resource-config
  namespace: agenthub
data:
  resource-limits.xml: |
    <clickhouse>
      <logger>
        <level>warning</level>
      </logger>
      <max_thread_pool_size>64</max_thread_pool_size>
      <max_concurrent_queries>2</max_concurrent_queries>
      <max_connections>32</max_connections>
      <uncompressed_cache_size>67108864</uncompressed_cache_size>
      <mark_cache_size>67108864</mark_cache_size>
      <index_mark_cache_size>33554432</index_mark_cache_size>
      <background_pool_size>2</background_pool_size>
      <background_move_pool_size>1</background_move_pool_size>
      <background_fetches_pool_size>1</background_fetches_pool_size>
      <background_common_pool_size>1</background_common_pool_size>
      <background_schedule_pool_size>2</background_schedule_pool_size>
      <background_buffer_flush_schedule_pool_size>2</background_buffer_flush_schedule_pool_size>
      <background_message_broker_schedule_pool_size>2</background_message_broker_schedule_pool_size>
      <background_distributed_schedule_pool_size>2</background_distributed_schedule_pool_size>
      <merge_tree>
        <number_of_free_entries_in_pool_to_execute_mutation>1</number_of_free_entries_in_pool_to_execute_mutation>
        <number_of_free_entries_in_pool_to_lower_max_size_of_merge>1</number_of_free_entries_in_pool_to_lower_max_size_of_merge>
        <number_of_free_entries_in_pool_to_execute_optimize_entire_partition>1</number_of_free_entries_in_pool_to_execute_optimize_entire_partition>
      </merge_tree>
      <query_log remove="1" />
      <trace_log remove="1" />
      <query_thread_log remove="1" />
      <query_views_log remove="1" />
      <part_log remove="1" />
      <text_log remove="1" />
      <metric_log remove="1" />
      <error_log remove="1" />
      <query_metric_log remove="1" />
      <asynchronous_metric_log remove="1" />
      <opentelemetry_span_log remove="1" />
      <crash_log remove="1" />
      <processors_profile_log remove="1" />
      <asynchronous_insert_log remove="1" />
      <backup_log remove="1" />
      <s3queue_log remove="1" />
      <blob_storage_log remove="1" />
    </clickhouse>
  user-limits.xml: |
    <clickhouse>
      <profiles>
        <default>
          <max_memory_usage>805306368</max_memory_usage>
          <max_threads>1</max_threads>
          <max_insert_threads>1</max_insert_threads>
        </default>
      </profiles>
    </clickhouse>
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-data-pvc
  namespace: agenthub
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-logs-pvc
  namespace: agenthub
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  namespace: agenthub
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.12
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8123
            - containerPort: 9000
          env:
            - name: CLICKHOUSE_DB
              value: agenthub
            - name: CLICKHOUSE_USER
              value: default
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: logs
              mountPath: /var/log/clickhouse-server
            - name: low-resource-config
              mountPath: /etc/clickhouse-server/config.d/resource-limits.xml
              subPath: resource-limits.xml
            - name: low-resource-config
              mountPath: /etc/clickhouse-server/users.d/user-limits.xml
              subPath: user-limits.xml
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 1536Mi
      securityContext:
        sysctls: []
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clickhouse-data-pvc
        - name: logs
          persistentVolumeClaim:
            claimName: clickhouse-logs-pvc
        - name: low-resource-config
          configMap:
            name: clickhouse-low-resource-config
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: agenthub
  labels:
    app: clickhouse
spec:
  selector:
    app: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
