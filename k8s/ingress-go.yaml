# Ingress para servicos Go (substituindo Java)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agenthub-api-ingress
  namespace: agenthub
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: api.agenthub.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agenthub-api
                port:
                  number: 8081
    - host: orchestrator.agenthub.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agenthub-orchestrator
                port:
                  number: 8084
    - host: observability.agenthub.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agenthub-observability
                port:
                  number: 8086
