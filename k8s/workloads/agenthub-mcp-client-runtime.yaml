apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenthub-mcp-client-runtime
  namespace: agenthub
  labels:
    app: agenthub-mcp-client-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agenthub-mcp-client-runtime
  template:
    metadata:
      labels:
        app: agenthub-mcp-client-runtime
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agenthub-mcp-client-runtime
          image: registry.cezar.dev/agenthub-mcp-client-runtime@sha256:b1009e55c104a944322641e3bc1155a48ca5dc768d3bbb2e633e7efbac50b647
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: "info"
            - name: AGENTHUB_BACKEND_URL
              value: http://agenthub-api.agenthub.svc.cluster.local:8081
            - name: AGENTHUB_TENANT_ID
              value: "test"
            - name: AGENTHUB_KEYCLOAK_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: agenthub-config
                  key: keycloak-url
            - name: AGENTHUB_CLIENT_ID
              value: agenthub-mcp-client-runtime
            - name: AGENTHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: mcp-client-runtime-client-secret
            - name: MCP_RUNTIME_AUDIENCE
              value: agenthub-mcp-client-runtime
            - name: MCP_RUNTIME_ALLOWED_CLIENT_ID
              value: agenthub-api
            - name: MCP_RUNTIME_ENABLE_MANAGEMENT_API
              value: "false"
            - name: MCP_RUNTIME_ENABLE_GRPC
              value: "false"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agenthub-mcp-client-runtime
  namespace: agenthub
spec:
  selector:
    app: agenthub-mcp-client-runtime
  ports:
    - protocol: TCP
      name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agenthub-mcp-client-runtime-api-only
  namespace: agenthub
spec:
  podSelector:
    matchLabels:
      app: agenthub-mcp-client-runtime
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: agenthub-api
      ports:
        - protocol: TCP
          port: 8080

