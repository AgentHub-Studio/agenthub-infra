---
# Blue-Green: agenthub-skill-runtime Go deployment
# Deploy alongside Java BEFORE switching traffic.
# Switch: kubectl patch svc agenthub-skill-runtime -n agenthub
#           -p '{"spec":{"selector":{"app":"agenthub-skill-runtime","version":"go"}}}'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenthub-skill-runtime-go
  namespace: agenthub
  labels:
    app: agenthub-skill-runtime
    version: go
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agenthub-skill-runtime
      version: go
  template:
    metadata:
      labels:
        app: agenthub-skill-runtime
        version: go
    spec:
      containers:
        - name: skill-runtime
          image: localhost:5000/agenthub-skill-runtime:latest
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: agenthub-skill-runtime-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: DATABASE_URL
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: MINIO_SECRET_KEY
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
