---
# Blue-Green: agenthub-observability Go deployment
# Deploy this alongside the Java deployment BEFORE switching traffic.
# Switch: kubectl patch svc agenthub-observability -n agenthub
#           -p '{"spec":{"selector":{"app":"agenthub-observability","version":"go"}}}'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenthub-observability-go
  namespace: agenthub
  labels:
    app: agenthub-observability
    version: go
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agenthub-observability
      version: go
  template:
    metadata:
      labels:
        app: agenthub-observability
        version: go
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: observability
          image: registry.cezar.dev/agenthub-observability:bf8bc6b5452a
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef:
                name: agenthub-observability-config
          env:
            - name: CLICKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: CLICKHOUSE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: RABBITMQ_URL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
