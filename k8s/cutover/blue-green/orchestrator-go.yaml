---
# Blue-Green: agenthub-orchestrator Go deployment
# Deploy alongside Java BEFORE switching traffic.
# Switch: kubectl patch svc agenthub-orchestrator -n agenthub
#           -p '{"spec":{"selector":{"app":"agenthub-orchestrator","version":"go"}}}'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenthub-orchestrator-go
  namespace: agenthub
  labels:
    app: agenthub-orchestrator
    version: go
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agenthub-orchestrator
      version: go
  template:
    metadata:
      labels:
        app: agenthub-orchestrator
        version: go
    spec:
      containers:
        - name: orchestrator
          image: registry.cezar.dev/agenthub-orchestrator:latest
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: agenthub-orchestrator-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: DATABASE_URL
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agenthub-llm-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agenthub-llm-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agenthub-llm-secrets
                  key: OPENROUTER_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
