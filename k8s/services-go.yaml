  template:
    metadata:
      labels:
        app: agenthub-orchestrator
        version: go
    spec:
      containers:
        - name: agenthub-orchestrator
          image: registry.local/agenthub-orchestrator:latest
          ports:
            - containerPort: 8084
          env:
            - name: PORT
              value: "8084"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
