# agenthub-api (Go) — Fase 2 Backend Core
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenthub-api
  namespace: agenthub
  labels:
    app: agenthub-api
    version: go
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agenthub-api
  template:
    metadata:
      labels:
        app: agenthub-api
        version: go
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agenthub-api
          image: registry.cezar.dev/agenthub-api:84f4f9c5adcc
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: agenthub-api-config
          env:
            - name: PORT
              value: "8081"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: database-url
            - name: KEYCLOAK_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: agenthub-config
                  key: keycloak-url
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: MCP_RUNTIME_URL
              value: http://agenthub-mcp-client-runtime.agenthub.svc.cluster.local:8080
            - name: MCP_RUNTIME_CLIENT_ID
              value: agenthub-api
            - name: MCP_RUNTIME_AUDIENCE
              value: agenthub-mcp-client-runtime
            - name: MCP_RUNTIME_CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: mcp-runtime-credential-encryption-key
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: agenthub-config
                  key: minio-endpoint
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: minio-secret-key
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: rabbitmq-url
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: keycloak-admin-password
            - name: LOG_LEVEL
              value: "info"
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: agenthub-config
                  key: cors-origins
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8081
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: agenthub-api
  namespace: agenthub
spec:
  selector:
    app: agenthub-api
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
---
# agenthub-orchestrator (Go) — Fase 4 Orchestrator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenthub-orchestrator
  namespace: agenthub
  labels:
    app: agenthub-orchestrator
    version: go
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agenthub-orchestrator
  template:
    metadata:
      labels:
        app: agenthub-orchestrator
        version: go
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agenthub-orchestrator
          image: registry.cezar.dev/agenthub-orchestrator:dea0c0302a7d
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8084
          env:
            - name: PORT
              value: "8084"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: database-url
            - name: KEYCLOAK_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: agenthub-config
                  key: keycloak-url
            - name: SKILL_RUNTIME_URL
              value: "http://agenthub-skill-runtime:8083"
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: rabbitmq-url
            # Provider de LLM. Até 2026-08-02 o orchestrator subia sem nenhuma env de
            # provider, então só o Ollama era registrado (OLLAMA_BASE_URL tem default
            # "http://ollama:11434" no código) — apontando para um Ollama sem modelo
            # carregado. Na prática, geração não funcionava.
            # O provider "ollama" é um wrapper sobre o cliente OpenAI, então o LiteLLM
            # atende os dois caminhos. openai-base-url deve apontar para
            # http://litellm.litellm.svc.cluster.local:4000/v1 e openai-api-key deve
            # conter o LITELLM_MASTER_KEY (copiado de litellm-secrets — Secret é
            # namespaced e não cruza de litellm para agenthub).
            - name: OPENAI_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: agenthub-config
                  key: openai-base-url
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: openai-api-key
                  optional: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agenthub-orchestrator
  namespace: agenthub
spec:
  selector:
    app: agenthub-orchestrator
  ports:
    - port: 8084
      targetPort: 8084
---
