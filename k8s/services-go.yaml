# agenthub-observability (Go) — Fase 1 Observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenthub-observability
  namespace: agenthub
  labels:
    app: agenthub-observability
    version: go
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agenthub-observability
  template:
    metadata:
      labels:
        app: agenthub-observability
        version: go
    spec:
      containers:
        - name: agenthub-observability
          image: registry.local/agenthub-observability:latest
          ports:
            - containerPort: 8086
          env:
            - name: PORT
              value: "8086"
            - name: CLICKHOUSE_DSN
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: clickhouse-dsn
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: rabbitmq-url
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agenthub-observability
  namespace: agenthub
spec:
  selector:
    app: agenthub-observability
  ports:
    - port: 8086
      targetPort: 8086
---
# ConfigMap for Go services
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agenthub-config
  namespace: agenthub
data:
  keycloak-url: "http://keycloak.agenthub.svc.cluster.local:8080"
  minio-endpoint: "minio.agenthub.svc.cluster.local:9000"
  cors-origins: "https://app.cezar.dev,https://test.cezar.dev,https://chat.cezar.dev"
  # Ollama local inference (opcional — remova se não usar Ollama)
  ollama-base-url: "http://ollama.agenthub.svc.cluster.local:11434"
