                  key: keycloak-url
            - name: SKILL_RUNTIME_URL
              value: "http://agenthub-skill-runtime:8083"
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: rabbitmq-url
          resources:
            requests:
              memory: "32Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agenthub-orchestrator
  namespace: agenthub
spec:
  selector:
    app: agenthub-orchestrator
  ports:
    - port: 8084
      targetPort: 8084
---
