# agenthub-api (Go) — Fase 2 Backend Core
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenthub-api
  namespace: agenthub
  labels:
    app: agenthub-api
    version: go
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agenthub-api
  template:
    metadata:
      labels:
        app: agenthub-api
        version: go
    spec:
      containers:
        - name: agenthub-api
          image: registry.cezar.dev/agenthub-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: database-url
            - name: KEYCLOAK_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: agenthub-config
                  key: keycloak-url
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: agenthub-config
                  key: minio-endpoint
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: minio-secret-key
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: rabbitmq-url
            - name: LOG_LEVEL
              value: "info"
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: agenthub-config
                  key: cors-origins
          resources:
            requests:
              memory: "32Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agenthub-api
  namespace: agenthub
spec:
  selector:
    app: agenthub-api
  ports:
    - port: 8081
      targetPort: 8081
---
# agenthub-orchestrator (Go) — Fase 4 Orchestrator
---
apiVersion: apps/v1
kind: Deployment
