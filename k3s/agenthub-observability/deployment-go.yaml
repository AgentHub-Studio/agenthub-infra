apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenthub-observability-go
  namespace: agenthub
  labels:
    app: agenthub-observability
    version: go
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agenthub-observability
      version: go
  template:
    metadata:
      labels:
        app: agenthub-observability
        version: go
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agenthub-observability
          image: registry.cezar.dev/agenthub-observability:bf8bc6b5452a
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8086
          env:
            - name: PORT
              value: "8086"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: database-url
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: rabbitmq-url
            - name: CLICKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: CLICKHOUSE_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: agenthub-observability
  namespace: agenthub
spec:
  selector:
    app: agenthub-observability
    version: go
  ports:
    - port: 8086
      targetPort: 8086
