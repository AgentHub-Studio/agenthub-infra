apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenthub-orchestrator-go
  namespace: agenthub
  labels:
    app: agenthub-orchestrator
    version: go
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agenthub-orchestrator
      version: go
  template:
    metadata:
      labels:
        app: agenthub-orchestrator
        version: go
    spec:
      containers:
        - name: agenthub-orchestrator
          image: registry.cezar.dev/agenthub-orchestrator:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          env:
            - name: PORT
              value: "8084"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: database-url
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: rabbitmq-url
            - name: KEYCLOAK_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: agenthub-config
                  key: keycloak-url
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: agenthub-orchestrator
  namespace: agenthub
spec:
  selector:
    app: agenthub-orchestrator
    version: go
  ports:
    - port: 8084
      targetPort: 8084
