apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenthub-api-go
  namespace: agenthub
  labels:
    app: agenthub-api
    version: go
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agenthub-api
      version: go
  template:
    metadata:
      labels:
        app: agenthub-api
        version: go
    spec:
      containers:
        - name: agenthub-api
          image: registry.local/agenthub-api:latest
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: database-url
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: rabbitmq-url
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: agenthub-config
                  key: minio-endpoint
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: minio-secret-key
            - name: KEYCLOAK_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: agenthub-config
                  key: keycloak-base-url
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: agenthub-api
  namespace: agenthub
spec:
  selector:
    app: agenthub-api
    version: java
  ports:
    - port: 8081
      targetPort: 8081
