apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenthub-skill-runtime-go
  namespace: agenthub
  labels:
    app: agenthub-skill-runtime
    version: go
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agenthub-skill-runtime
      version: go
  template:
    metadata:
      labels:
        app: agenthub-skill-runtime
        version: go
    spec:
      containers:
        - name: agenthub-skill-runtime
          image: registry.local/agenthub-skill-runtime:latest
          ports:
            - containerPort: 8083
          env:
            - name: PORT
              value: "8083"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: database-url
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: rabbitmq-url
            - name: KEYCLOAK_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: agenthub-config
                  key: keycloak-base-url
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: agenthub-skill-runtime
  namespace: agenthub
spec:
  selector:
    app: agenthub-skill-runtime
    version: java
  ports:
    - port: 8083
      targetPort: 8083
