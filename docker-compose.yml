# Shared external network
networks:
  agenthub-shared-net:
    external: true

# Volumes
volumes:
  postgres_data:
  minio_data:
  ollama_data:
  agenthub-clickhouse-data:
    external: true
    name: agenthub-clickhouse-data
  agenthub-clickhouse-logs:
    external: true
    name: agenthub-clickhouse-logs

services:
  # ==========================================
  # INFRA - Profile: minimal, backend, full
  # ==========================================

  postgres:
    profiles: ["minimal", "backend", "full", "edge"]
    image: registry.cezar.dev/agenthub-infra-postgres:8b1608a36989
    pull_policy: missing
    build:
      context: .
      dockerfile: images/postgres/Dockerfile
      args:
        OCI_CREATED: ${OCI_CREATED:-2026-06-29T20:00:00Z}
        OCI_REVISION: 8b1608a3698976bfa70d6347de1ab93d38ab2a46
        OCI_VERSION: 8b1608a36989
        OCI_TITLE: agenthub-infra-postgres
    container_name: agenthub-postgres
    networks:
      agenthub-shared-net:
        aliases:
          - postgres.internal
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agenthub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docs/spec/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  keycloak:
    profiles: ["minimal", "backend", "full", "edge"]
    image: registry.cezar.dev/agenthub-infra-keycloak:8b1608a36989
    pull_policy: missing
    build:
      context: .
      dockerfile: images/keycloak/Dockerfile
      args:
        OCI_CREATED: ${OCI_CREATED:-2026-06-29T20:00:00Z}
        OCI_REVISION: 8b1608a3698976bfa70d6347de1ab93d38ab2a46
        OCI_VERSION: 8b1608a36989
        OCI_TITLE: agenthub-infra-keycloak
    container_name: agenthub-keycloak
    user: "10001:10001"
    networks:
      agenthub-shared-net:
        aliases:
          - keycloak.internal
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_HOST: "0.0.0.0"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres.internal:5432/${POSTGRES_DB:-agenthub}
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  minio:
    profiles: ["minimal", "backend", "full", "edge"]
    image: registry.cezar.dev/agenthub-infra-seaweedfs:76eb21cdf814
    pull_policy: missing
    container_name: agenthub-minio
    user: "10001:10001"
    networks:
      agenthub-shared-net:
        aliases:
          - minio.internal
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  ollama:
    profiles: ["minimal", "backend", "full", "edge"]
    image: registry.cezar.dev/agenthub-infra-ollama:76eb21cdf814
    pull_policy: missing
    container_name: agenthub-ollama
    user: "10001:10001"
    networks:
      agenthub-shared-net:
        aliases:
          - ollama.internal
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/home/ollama/.ollama
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null 2>&1"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  rabbitmq:
    profiles: ["minimal", "backend", "full", "edge"]
    image: registry.cezar.dev/agenthub-infra-rabbitmq:8b1608a36989
    pull_policy: missing
    build:
      context: .
      dockerfile: images/rabbitmq/Dockerfile
      args:
        OCI_CREATED: ${OCI_CREATED:-2026-07-13T04:30:00Z}
        OCI_REVISION: 8b1608a3698976bfa70d6347de1ab93d38ab2a46
        OCI_VERSION: 8b1608a36989
        OCI_TITLE: agenthub-infra-rabbitmq
    container_name: agenthub-rabbitmq
    networks:
      agenthub-shared-net:
        aliases:
          - rabbitmq.internal
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================
  # BACKEND - Profile: backend, full
  # ==========================================

  backend:
    profiles: ["backend", "full", "edge"]
    build:
      context: ../agenthub-backend
      dockerfile: Dockerfile
    container_name: agenthub-backend
    networks:
      agenthub-shared-net:
        aliases:
          - agenthub.backend.internal
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: unless-stopped

  frontend:
    profiles: ["backend", "full", "edge"]
    build:
      context: ../agenthub-frontend
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile}
    container_name: agenthub-frontend
    networks:
      agenthub-shared-net:
        aliases:
          - agenthub.frontend.internal
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    environment:
      API_BASE_URL: ${FRONTEND_API_URL:-https://api.cezar.dev}
    depends_on:
      - backend
    restart: unless-stopped

  # ==========================================
  # FLUTTER CHAT - Profile: backend, full, edge
  # ==========================================

  chat:
    profiles: ["backend", "full", "edge"]
    build:
      context: ../agenthub-chat
      dockerfile: Dockerfile
      args:
        PARENT_ORIGIN: ${CHAT_PARENT_ORIGIN:-https://app.cezar.dev}
    container_name: agenthub-chat
    networks:
      agenthub-shared-net:
        aliases:
          - agenthub.chat.internal
    ports:
      - "${CHAT_PORT:-4300}:80"
    environment:
      AGENTHUB_BACKEND_URL: ${CHAT_BACKEND_URL:-http://agenthub.backend.internal:8081}
    depends_on:
      - backend
    restart: unless-stopped

  # ==========================================
  # ORCHESTRATOR - Profile: full
  # ==========================================

  orchestrator:
    profiles: ["full"]
    build:
      context: ../agenthub-orchestrator
      dockerfile: Dockerfile
    container_name: agenthub-orchestrator
    networks:
      agenthub-shared-net:
        aliases:
          - agenthub.orchestrator.internal
    ports:
      - "${ORCHESTRATOR_PORT:-8082}:8082"
    environment:
      SERVER_PORT: 8082
    depends_on:
      - backend
      - rabbitmq
      - ollama
    restart: unless-stopped

  skill-runtime:
    profiles: ["full"]
    build:
      context: ../agenthub-skill-runtime
      dockerfile: Dockerfile
    container_name: agenthub-skill-runtime
    networks:
      agenthub-shared-net:
        aliases:
          - agenthub.skill-runtime.internal
    ports:
      - "${SKILL_RUNTIME_PORT:-8083}:8083"
    environment:
      SERVER_PORT: 8083
    depends_on:
      - backend
      - postgres
    restart: unless-stopped

  observability:
    profiles: ["full"]
    build:
      context: ../agenthub-observability
      dockerfile: Dockerfile
    container_name: agenthub-observability
    networks:
      agenthub-shared-net:
        aliases:
          - agenthub.observability.internal
    ports:
      - "${OBSERVABILITY_PORT:-8086}:8086"
    environment:
      SERVER_PORT: 8086
      CLICKHOUSE_URL: jdbc:clickhouse://clickhouse.internal:8123/agenthub
      CLICKHOUSE_R2DBC_URL: r2dbc:clickhouse://clickhouse.internal:8123/agenthub
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    depends_on:
      - postgres
      - clickhouse
    restart: unless-stopped

  package-registry:
    profiles: ["full"]
    build:
      context: ../agenthub-package-registry
      dockerfile: Dockerfile
    container_name: agenthub-package-registry
    networks:
      agenthub-shared-net:
        aliases:
          - agenthub.package-registry.internal
    ports:
      - "${PACKAGE_REGISTRY_PORT:-8084}:8084"
    environment:
      SERVER_PORT: 8084
    depends_on:
      - postgres
      - minio
    restart: unless-stopped

  marketplace:
    profiles: ["full"]
    build:
      context: ../agenthub-marketplace
      dockerfile: Dockerfile
    container_name: agenthub-marketplace
    networks:
      agenthub-shared-net:
        aliases:
          - agenthub.marketplace.internal
    ports:
      - "${MARKETPLACE_PORT:-8085}:8085"
    environment:
      SERVER_PORT: 8085
    depends_on:
      - postgres
      - package-registry
    restart: unless-stopped

  # ==========================================
  # MCP - Profile: full
  # ==========================================

  mcp-client:
    profiles: ["full"]
    build:
      context: ../agenthub-mcp-client-runtime
      dockerfile: Dockerfile
    container_name: agenthub-mcp-client
    networks:
      agenthub-shared-net:
        aliases:
          - agenthub.mcp-client.internal
          # The Go API resolves the canonical in-cluster service name.
          - agenthub-mcp-client-runtime
    ports:
      - "${MCP_CLIENT_RUNTIME_PORT:-8090}:8080"
    environment:
      HTTP_PORT: "8080"
      GRPC_PORT: "50051"
      LOG_LEVEL: ${MCP_CLIENT_RUNTIME_LOG_LEVEL:-info}
      AGENTHUB_BACKEND_URL: ${MCP_CLIENT_RUNTIME_BACKEND_URL:-http://agenthub.backend.internal:8081}
      AGENTHUB_TENANT_ID: ${MCP_CLIENT_RUNTIME_TENANT_ID:-test}
      AGENTHUB_KEYCLOAK_BASE_URL: ${MCP_CLIENT_RUNTIME_KEYCLOAK_BASE_URL:-http://keycloak.internal:8080}
      AGENTHUB_CLIENT_ID: ${MCP_CLIENT_RUNTIME_CLIENT_ID:-agenthub-mcp-client-runtime}
      AGENTHUB_CLIENT_SECRET: ${MCP_CLIENT_RUNTIME_CLIENT_SECRET:-}
    depends_on:
      - backend
      - keycloak
    restart: unless-stopped

  mcp-server:
    profiles: ["full"]
    build:
      context: ../agenthub-mcp-server-runtime
      dockerfile: Dockerfile
    container_name: agenthub-mcp-server
    networks:
      agenthub-shared-net:
        aliases:
          - agenthub.mcp-server.internal
    ports:
      - "${MCP_SERVER_RUNTIME_PORT:-8091}:8091"
    environment:
      PORT: 8091
    depends_on:
      - backend
    restart: unless-stopped

  clickhouse:
    profiles: ["full"]
    image: registry.cezar.dev/agenthub-infra-clickhouse:8b1608a36989
    pull_policy: missing
    build:
      context: .
      dockerfile: images/clickhouse/Dockerfile
      args:
        OCI_CREATED: ${OCI_CREATED:-2026-07-13T04:45:00Z}
        OCI_REVISION: 8b1608a3698976bfa70d6347de1ab93d38ab2a46
        OCI_VERSION: 8b1608a36989
        OCI_TITLE: agenthub-infra-clickhouse
    container_name: agenthub-clickhouse
    networks:
      agenthub-shared-net:
        aliases:
          - clickhouse.internal
    ports:
      - "8123:8123"
      - "9100:9000"
    environment:
      CLICKHOUSE_DB: agenthub
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - agenthub-clickhouse-data:/var/lib/clickhouse
      - agenthub-clickhouse-logs:/var/log/clickhouse-server
      - ../agenthub-clickhouse/config/config.xml:/etc/clickhouse-server/config.d/custom.xml:ro
      - ../agenthub-clickhouse/initdb:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ==========================================
  # SUPPORT SERVICES - Profile: full
  # ==========================================

  embedding:
    profiles: ["full"]
    build:
      context: ../agenthub-embedding
      dockerfile: Dockerfile
    container_name: agenthub-embedding
    networks:
      agenthub-shared-net:
        aliases:
          - agenthub.embedding.internal
    ports:
      - "${EMBEDDING_PORT:-8092}:8092"
    environment:
      PORT: 8092
      DB_URL: ${EMBEDDING_DB_URL:-postgresql://agenthub:changeme_secure_password@postgres.internal:5432/agenthub}
      OLLAMA_URL: http://ollama.internal:11434
    restart: unless-stopped

  embedding-job:
    profiles: ["full"]
    build:
      context: ../agenthub-embedding-job
      dockerfile: Dockerfile
    container_name: agenthub-embedding-job
    networks:
      agenthub-shared-net:
        aliases:
          - agenthub.embedding-job.internal
    environment:
      DB_URL: ${EMBEDDING_JOB_DB_URL:-postgresql://agenthub:changeme_secure_password@postgres.internal:5432/agenthub}
      OLLAMA_URL: http://ollama.internal:11434
      EMBEDDING_SERVICE_URL: http://agenthub.embedding.internal:8092
      RABBITMQ_HOST: rabbitmq.internal
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-agenthub}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-changeme_rabbitmq_password}
    depends_on:
      - postgres
      - rabbitmq
      - embedding
    restart: unless-stopped

  extractor:
    profiles: ["full"]
    build:
      context: ../agenthub-extractor
      dockerfile: Dockerfile
    container_name: agenthub-extractor
    networks:
      agenthub-shared-net:
        aliases:
          - agenthub.extractor.internal
    ports:
      - "${EXTRACTOR_PORT:-8093}:8093"
    environment:
      PORT: 8093
      DB_URL: ${EXTRACTOR_DB_URL:-postgresql://agenthub:changeme_secure_password@postgres.internal:5432/agenthub}
      MINIO_URL: http://minio.internal:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    restart: unless-stopped

  graph-generator:
    profiles: ["full"]
    build:
      context: ../agenthub-graph-generator
      dockerfile: Dockerfile
    container_name: agenthub-graph-generator
    networks:
      agenthub-shared-net:
        aliases:
          - agenthub.graph-generator.internal
    ports:
      - "${GRAPH_GENERATOR_PORT:-8094}:8094"
    environment:
      PORT: 8094
      DB_URL: ${GRAPH_GENERATOR_DB_URL:-postgresql://agenthub:changeme_secure_password@postgres.internal:5432/agenthub}
      OLLAMA_URL: http://ollama.internal:11434
    restart: unless-stopped

  vpn-proxy:
    profiles: ["full"]
    build:
      context: ../agenthub-vpn-proxy
      dockerfile: Dockerfile
    container_name: agenthub-vpn-proxy
    networks:
      agenthub-shared-net:
        aliases:
          - agenthub.vpn-proxy.internal
    ports:
      - "${VPN_PROXY_PORT:-8095}:8095"
    environment:
      PORT: 8095
      DB_URL: ${VPN_PROXY_DB_URL:-postgresql://agenthub:changeme_secure_password@postgres.internal:5432/agenthub}
    restart: unless-stopped

  # ==========================================
  # EDGE - Profile: edge (Nginx + Cloudflare)
  # ==========================================

  nginx:
    profiles: ["edge"]
    build:
      context: ../agenthub-nginx
      dockerfile: Dockerfile
    container_name: agenthub-nginx
    networks:
      agenthub-shared-net:
        aliases:
          - nginx.agenthub.dev.local
    ports:
      - "10000:10000"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  cloudflare:
    profiles: ["edge"]
    build:
      context: ../agenthub-cloudflare
      dockerfile: Dockerfile
    container_name: agenthub-cloudflared
    networks:
      - agenthub-shared-net
    restart: unless-stopped
